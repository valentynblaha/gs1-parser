name: CI (Tests + Dry Publish Check)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required to generate the versioned API docs from tags

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - run: pnpm ci

      - run: pnpm test

      - run: pnpm run build

      - name: Verify npm packaging (dry run)
        run: pnpm --filter @valentynb/gs1-parser pack --dry-run

      - name: Build docs
        run: pnpm run docs:build
