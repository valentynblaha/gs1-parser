name: CI (Tests + Dry Publish Check)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - run: pnpm ci

      - run: pnpm test

      - run: pnpm run build

      - name: Verify npm packaging (dry run)
        run: pnpm pack --dry-run
