name: Publish to npm

on:
  workflow_run:
    workflows: [Create GitHub Release]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@24
          cache: true

      - name: Update pnpm
        run: pnpm install -g pnpm@latest

      - name: Install dependencies
        run: pnpm ci

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Publish
        run: pnpm publish --provenance
