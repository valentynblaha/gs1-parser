name: Publish to npm

on:
  workflow_run:
    workflows: [Create GitHub Release]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm ci

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Publish
        run: pnpm publish --provenance
