name: Deploy Docs

# Netlify builds the docs on every push to main (see netlify.toml), but not on
# tag pushes. This triggers a rebuild after a release, so the new API version is listed
on:
  workflow_run:
    workflows: [Create GitHub Release]
    types:
      - completed
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Netlify build
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: curl --fail-with-body -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
